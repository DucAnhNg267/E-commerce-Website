# Database - prefer to set via environment
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/webecom_db}
spring.datasource.username=${DATABASE_USER:webecom_user}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# JWT / security
security.jwt.secret=${JWT_SECRET:replace_me}

# Logging
logging.level.org.springframework=INFO
